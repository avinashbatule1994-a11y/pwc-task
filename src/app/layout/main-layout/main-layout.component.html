<mat-sidenav-container class="container">

  <mat-sidenav mode="side" opened>
    <mat-toolbar color="primary">Workflow App</mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="dashboard">
        <mat-icon></mat-icon>
        Dashboard
      </a>

      <a mat-list-item routerLink="/workflows">
        <mat-icon></mat-icon>
        Workflows
      </a>

      <a
        *ngIf="(user$ | async)?.role !== 'USER'"
        mat-list-item
        routerLink="/workflows/approve">
        <mat-icon></mat-icon>
        Approvals
      </a>
    </mat-nav-list>
  </mat-sidenav>
 <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isMobile$ | async">
        <mat-icon>menu</mat-icon>
      </button>

      <span *ngIf="(userLabel$ | async) as label" class="user">{{ label }}</span>
      <div>
        <button mat-button (click)="toggleTheme()">Theme</button>
        <button mat-button (click)="logout()">Logout</button>
      </div>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
