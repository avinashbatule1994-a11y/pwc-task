<mat-sidenav-container class="container">

  <!-- SIDE NAV -->
  <mat-sidenav #sidenav [mode]="(isMobile$ | async) ? 'over' : 'side'" [opened]="!(isMobile$ | async)">

    <mat-toolbar color="primary">
      Workflow App
    </mat-toolbar>

<mat-nav-list>

  <a mat-list-item routerLink="/dashboard">
    <mat-icon matListItemIcon>dashboard</mat-icon>
    <span matListItemTitle>Dashboard</span>
  </a>

  <a mat-list-item routerLink="/workflows">
    <mat-icon matListItemIcon>list</mat-icon>
    <span matListItemTitle>Workflows</span>
  </a>

  <a
    *ngIf="(user$ | async)?.role !== 'USER'"
    mat-list-item
    routerLink="/workflows/approve">

    <mat-icon matListItemIcon>check_circle</mat-icon>
    <span matListItemTitle>Approvals</span>
  </a>

</mat-nav-list>

  </mat-sidenav>

  <!-- MAIN CONTENT -->
  <mat-sidenav-content>

    <mat-toolbar color="primary" class="toolbar">

      <!-- Mobile Menu Button -->
      <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isMobile$ | async">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="app-title">Enterprise Management Platform</span>

      <span class="spacer"></span>

      <span *ngIf="(userLabel$ | async) as label" class="user">
        {{ label }}
      </span>

      <button mat-button (click)="toggleTheme()">Theme</button>
      <button mat-button (click)="logout()">Logout</button>

    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
