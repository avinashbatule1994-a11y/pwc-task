<mat-sidenav-container class="container">

  <mat-sidenav mode="side" opened>
    <mat-toolbar color="primary">Workflow App</mat-toolbar>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard">
        <mat-icon></mat-icon>
        Dashboard
      </a>

      <a mat-list-item routerLink="/workflows">
        <mat-icon></mat-icon>
        Workflows
      </a>

      <a
        *ngIf="(user$ | async)?.role !== 'USER'"
        mat-list-item
        routerLink="/workflows/approve">
        <mat-icon></mat-icon>
        Approvals
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span>Dashboard</span>
      <span class="spacer"></span>
      <button mat-button (click)="auth.logout()">Logout</button>
    </mat-toolbar>

    <div class="page">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
