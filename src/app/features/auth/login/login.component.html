<p>login works!</p>
<section class="login-container">
  <h2>Login</h2>

  <form [formGroup]="form" (ngSubmit)="login()" novalidate>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="admin@test.com"
      />

      <small class="error"
        *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email
      </small>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="******"
      />

      <small class="error"
        *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password is required
      </small>
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="form.invalid">
      Login
    </button>

  </form>

  <!-- Helper info (optional, good for demo) -->
  <div class="hint">
    <p><strong>Demo users:</strong></p>
    <ul>
      <li>admin@test.com / admin123 (ADMIN)</li>
      <li>manager@test.com / manager123 (MANAGER)</li>
      <li>user@test.com / user123 (USER)</li>
    </ul>
  </div>
</section>
