<h2>Workflow Dashboard</h2>

<section class="kpis">
  <div class="card">
    <h4>Average Completion Time</h4>
    <p>{{ avgCompletionTime$ | async }} days</p>
  </div>

  <div class="card">
    <h4>Overdue Workflows</h4>
    <p>{{ overdueCount$ | async }}</p>
  </div>
</section>

<section>
  <h3>Status Breakdown</h3>

<ng-container *ngIf="statusChartData$ | async as chartData">
  <app-chart
    [data]="chartData"
    type="bar">
  </app-chart>
</ng-container>

</section>
