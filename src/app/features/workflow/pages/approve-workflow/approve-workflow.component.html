
<h2>Approve Workflows</h2>

<table
  mat-table
  [dataSource]="(workflows$ | async) ?? []"
  class="mat-elevation-z2">

  <!-- Name -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let w">{{ w.name }}</td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let w">
      <mat-chip color="primary">{{ w.status }}</mat-chip>
    </td>
  </ng-container>

  <!-- Priority -->
  <ng-container matColumnDef="priority">
    <th mat-header-cell *matHeaderCellDef>Priority</th>
    <td mat-cell *matCellDef="let w">{{ w.priority }}</td>
  </ng-container>

  <!-- Due Date -->
  <ng-container matColumnDef="dueDate">
    <th mat-header-cell *matHeaderCellDef>Due Date</th>
    <td mat-cell *matCellDef="let w">
      {{ w.dueDate | date }}
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let w">
      <button mat-button color="primary" (click)="approve(w.id)">
        Approve
      </button>
      <button mat-button color="warn" (click)="reject(w.id)">
        Reject
      </button>
      <button mat-button (click)="pending(w.id)">
        In Review
      </button>
      <button mat-button (click)="draft(w.id)">
        Draft
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
