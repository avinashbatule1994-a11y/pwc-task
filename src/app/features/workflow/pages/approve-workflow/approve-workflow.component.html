<h2>Approve Workflows</h2>

<table
  mat-table
  [dataSource]="(workflows$ | async) ?? []"
  class="mat-elevation-z2">

  <!-- Name -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let w">{{ w.name }}</td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let w">
      <mat-chip color="primary">{{ w.status }}</mat-chip>
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let w">
      <button mat-button color="primary" (click)="approve(w.id)">
        Approve
      </button>
      <button mat-button color="warn" (click)="reject(w.id)">
        Reject
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
