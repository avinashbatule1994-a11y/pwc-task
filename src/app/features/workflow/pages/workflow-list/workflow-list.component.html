<h2>Workflow List</h2>

<div class="toolbar">
  <!-- Search -->
  <mat-form-field appearance="outline">
    <mat-label>Search</mat-label>
    <input matInput #searchInput (keyup)="applySearch(searchInput.value)" placeholder="Search workflows" />
  </mat-form-field>

  <!-- Status -->
  <mat-form-field appearance="outline">
    <mat-label>Status</mat-label>
    <mat-select (selectionChange)="filterStatus($event.value)">
      <mat-option value="">All</mat-option>
      <mat-option value="Draft">Draft</mat-option>
      <mat-option value="In Review">In Review</mat-option>
      <mat-option value="Approved">Approved</mat-option>
      <mat-option value="Rejected">Rejected</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="create()">
    + Create Workflow
  </button>
</div>

<!-- ✅ SAFE TABLE RENDER -->
<ng-container *ngIf="workflows$ | async as workflows">

  <table mat-table [dataSource]="workflows" class="mat-elevation-z2">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.status }}</td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef>Priority</th>
      <td mat-cell *matCellDef="let row">{{ row.priority }}</td>
    </ng-container>

    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>Due Date</th>
      <td mat-cell *matCellDef="let row">{{ row.dueDate | date }}</td>
    </ng-container>

    <!-- <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-button color="primary" (click)="approve(row)">Approve</button>
        <button mat-button color="warn" (click)="reject(row)">Reject</button>
        <button mat-button (click)="pending(row)">In Review</button>
        <button mat-button (click)="draft(row)">Draft</button>
      </td>
    </ng-container> -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="edit(row)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>
</ng-container>

<!-- ✅ PAGINATOR (NO ||) -->

<mat-paginator [length]="total$ | async" [pageIndex]="(query$ | async)?.page! - 1"
  [pageSize]="(query$ | async)?.pageSize!" [pageSizeOptions]="[5, 10, 25, 50]" (page)="pageChanged($event)" />
