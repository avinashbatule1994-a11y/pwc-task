
<mat-sidenav-container class="layout">

  <!-- MAIN -->
  <mat-sidenav-content>

    <!-- TOP BAR -->
    <mat-toolbar color="primary" class="toolbar">
      <span class="spacer"></span>
      vhanakhanderpradip@gmail.com (user)
      <span class="spacer"></span>
      <button mat-button>Theme</button>
      <button mat-button>Logout</button>
    </mat-toolbar>

    <!-- CONTENT -->
    <div class="content">

      <div class="header">
        <h2>Workflows</h2>
        <button mat-raised-button color="primary" (click)="create()">
          Create
        </button>
      </div>

      <!-- FILTERS -->
      <div class="filters">
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput #searchInput (keyup)="applySearch(searchInput.value)">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select (selectionChange)="filterStatus($event.value)">
            <mat-option value="">All</mat-option>
            <mat-option value="Draft">Draft</mat-option>
            <mat-option value="In Review">In Review</mat-option>
            <mat-option value="Approved">Approved</mat-option>
            <mat-option value="Rejected">Rejected</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- TABLE -->
      <mat-card>
        <table mat-table [dataSource]="dataSource">

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let w">{{ w.name }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let w">{{ w.status }}</td>
          </ng-container>

          <ng-container matColumnDef="priority">
            <th mat-header-cell *matHeaderCellDef>Priority</th>
            <td mat-cell *matCellDef="let w">{{ w.priority }}</td>
          </ng-container>

          <ng-container matColumnDef="dueDate">
            <th mat-header-cell *matHeaderCellDef>Due</th>
            <td mat-cell *matCellDef="let w">{{ w.dueDate }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let w">
              <a (click)="edit(w)">Edit</a>
              <a class="muted" (click)="delete(w)">Delete</a>
              <a class="muted" (click)="approve(w)">Approve</a>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>
      </mat-card>

    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
